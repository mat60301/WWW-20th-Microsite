    <style>
      .cls-1 {
        fill: #231f20;
      }

      .cls-2 {
        fill: none;
        stroke: #ed1c24;
        stroke-miterlimit: 10;
        stroke-width: 35px;
      }

      /* Hide reference red mask layers */
      #Masks {
        display: none;
      }

      /* 
        NEW TIMELINE BREAKDOWN (Total Duration: 3.875s loop):
        0.000s - 1.000s (0% to 25.81%): Initial 1s Pause
        1.000s - 1.250s (25.81% to 32.26%): "WHO" animates (0.25s)
        1.125s - 1.375s (29.03% to 35.48%): "WHAT" animates (starts halfway through WHO)
        1.250s - 1.500s (32.26% to 38.71%): "WEAR" animates (starts halfway through WHAT)
        1.250s - 2.000s (32.26% to 51.61%): "2" unmasks (starts SAME TIME as WEAR, lasts 0.75s)
        1.625s - 2.250s (41.94% to 58.06%): "0" unmasks (starts HALFWAY through 2, lasts 0.625s)
        2.250s - 3.875s (58.06% to 100%): Hold full state before loop reverses
      */

      /* ==========================================
         WORD: WHO ANIMATIONS
         ========================================== */
      #W-HO {
        transform-box: fill-box;
        transform-origin: center;
        animation: animateW-HO 3.875s ease-in-out infinite alternate;
      }

      #HO {
        transform-box: fill-box;
        transform-origin: left center;
        animation: animateHO 3.875s ease-in-out infinite alternate;
      }

      @keyframes animateW-HO {
        0%, 25.81% {
          transform: translateX(10.2px);
        }
        32.26%, 100% {
          transform: translateX(0);
        }
      }

      @keyframes animateHO {
        0%, 25.81% {
          transform: translateX(-88.9px);
          opacity: 0;
        }
        32.26%, 100% {
          transform: translateX(0);
          opacity: 1;
        }
      }

      /* ==========================================
         WORD: WHAT ANIMATIONS
         ========================================== */
      #W-HAT {
        transform-box: fill-box;
        transform-origin: center;
        animation: animateW-HAT 3.875s ease-in-out infinite alternate;
      }

      #HAT {
        transform-box: fill-box;
        transform-origin: left center;
        animation: animateHAT 3.875s ease-in-out infinite alternate;
      }

      @keyframes animateW-HAT {
        0%, 29.03% {
          transform: translateX(220.48px);
        }
        35.48%, 100% {
          transform: translateX(0);
        }
      }

      @keyframes animateHAT {
        0%, 29.03% {
          transform: translateX(162.72px);
          opacity: 0;
        }
        35.48%, 100% {
          transform: translateX(0);
          opacity: 1;
        }
      }

      /* ==========================================
         WORD: WEAR ANIMATIONS
         ========================================== */
      #W-EAR {
        transform-box: fill-box;
        transform-origin: center;
        animation: animateW-EAR 3.875s ease-in-out infinite alternate;
      }

      #EAR {
        transform-box: fill-box;
        transform-origin: left center;
        animation: animateEAR 3.875s ease-in-out infinite alternate;
      }

      @keyframes animateW-EAR {
        0%, 32.26% {
          transform: translateX(1.24px);
        }
        38.71%, 100% {
          transform: translateX(0);
        }
      }

      @keyframes animateEAR {
        0%, 32.26% {
          transform: translateX(-54.71px);
          opacity: 0;
        }
        38.71%, 100% {
          transform: translateX(0);
          opacity: 1;
        }
      }

      /* ==========================================
         MASK ANIMATIONS: "2" AND "0" DRAWING
         ========================================== */
      #Top_of_the_2 {
        mask: url(#two-draw-mask);
      }

      #Bottom_of_the_2_and_the_0 {
        mask: url(#combined-2-0-mask);
        -webkit-mask: url(#combined-2-0-mask);
      }

      .mask-stroke-two {
        stroke-dasharray: 1050;
        stroke-dashoffset: 1050;
        animation: drawTwo 3.875s ease-in-out infinite alternate;
      }

      @keyframes drawTwo {
        0%, 32.26% {
          stroke-dashoffset: 1050;
        }
        51.61%, 100% {
          stroke-dashoffset: 0;
        }
      }

      .mask-stroke-zero {
        stroke-dasharray: 1100;
        stroke-dashoffset: 1100;
        animation: drawZero 3.875s ease-in-out infinite alternate;
      }

      @keyframes drawZero {
        0%, 41.94% {
          stroke-dashoffset: 1100;
        }
        58.06%, 100% {
          stroke-dashoffset: 0;
        }
      }
    </style>
  </defs>
